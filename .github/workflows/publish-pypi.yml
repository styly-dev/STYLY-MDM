name: Publish server to PyPI

# Publishes the styly-mdm control server package. Fires on the same
# `release: published` event as the APK build (a human publishes the draft
# created by release-version-bump.yml), so the server and APK ship from one tag.
# workflow_dispatch runs a Test PyPI-only dry run for verification.
#
# Promotion is two-stage: build+test -> Test PyPI (auto) -> PyPI (gated by the
# protected `pypi` GitHub environment, which requires manual approval). Both
# publish jobs use Trusted Publishing (OIDC) — no API tokens/secrets. This
# requires a one-time Trusted Publisher setup on Test PyPI and PyPI, and the
# `testpypi` / `pypi` environments configured in the repo settings.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # gh release download (fetch the signed client APK asset)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history + tags so setuptools-scm can derive the version on a
          # workflow_dispatch run (the release path pins it via the tag below).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pin version from the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_STYLY_MDM=${TAG#v}" >> "$GITHUB_ENV"

      - name: Install package (with dev extras) and build tooling
        working-directory: mdm-server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build

      - name: Run tests
        working-directory: mdm-server
        run: python -m pytest -q

      - name: Bundle the signed client APK into the package
        # release.yml builds and uploads the signed styly-mdm-client_<tag>.apk asset
        # in parallel on this same event; fetch it so the wheel ships a matching,
        # same-signing-key client (Android rejects a differently signed update). The
        # wheel picks it up via the styly_mdm/client/* package-data glob and seeds it
        # into the data dir at startup. workflow_dispatch dry runs have no release
        # asset, so they skip this and build a wheel without the bundled client.
        if: github.event_name == 'release'
        working-directory: mdm-server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p styly_mdm/client
          # Poll: this job usually reaches here before the parallel APK build has
          # finished uploading (cold runner: Android SDK + first gradle can take
          # ~10 min). 30 x 60s = 30 min ceiling. The trailing non-empty check makes
          # success require an actual file, so a download that reports success but
          # writes nothing still fails closed rather than shipping a client-less wheel.
          for attempt in $(seq 1 30); do
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --pattern 'styly-mdm-client_*.apk' --dir styly_mdm/client/ --clobber \
               && [ -n "$(ls -A styly_mdm/client 2>/dev/null)" ]; then
              echo "Bundled client APK:"; ls -l styly_mdm/client/
              exit 0
            fi
            echo "Signed client APK not on release $TAG yet (attempt $attempt/30); waiting 60s…"
            sleep 60
          done
          echo "::error::Signed client APK never appeared on release $TAG; refusing to build a server wheel without it."
          exit 1

      - name: Build sdist and wheel
        working-directory: mdm-server
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: mdm-server/dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Dev builds reuse the same version across dispatch runs on one commit;
          # don't fail the dry run if it's already there.
          skip-existing: true

  publish-pypi:
    needs: publish-testpypi
    # Only real releases go to production PyPI; workflow_dispatch stops at Test PyPI.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi # protected: requires manual approval (the "after verification" gate)
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
