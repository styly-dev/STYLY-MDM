name: Issue 91 Fix and Verify

on:
  pull_request:
    branches:
      - suu/issue-91-push-job-model
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix-verify-commit:
    if: github.head_ref == 'suu/issue-91-verification-run'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out verification head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Repair and apply reviewed hardening patch
        run: |
          python .github/issue91_patch_fixes.py
          python .github/issue91_fix_and_verify.py apply

      - name: Validate Python syntax and patch whitespace
        run: |
          git diff --check
          python -m compileall -q mdm-server/styly_mdm

      - name: Install server test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './mdm-server[dev]'

      - name: Run server tests file by file with bounded diagnostics
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "===== ${file} ====="
            PYTHONUNBUFFERED=1 timeout --signal=TERM 180s \
              python -m pytest -vv -s --tb=short -o faulthandler_timeout=60 "${file}"
          done < <(find mdm-server/tests -maxdepth 1 -name 'test_*.py' -print | sort)

      - name: Run complete server test suite
        run: PYTHONUNBUFFERED=1 timeout --signal=TERM 300s python -m pytest -q mdm-server/tests

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run complete Android unit test suite
        run: |
          chmod +x mdm-client/gradlew
          cd mdm-client
          ./gradlew test --stacktrace

      - name: Remove temporary verification files
        run: |
          python .github/issue91_fix_and_verify.py cleanup
          rm -f .github/issue91_patch_fixes.py .github/issue91-verification-trigger.txt

      - name: Commit and push verified source changes
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden push job lifecycle and recovery'
          git push origin HEAD:suu/issue-91-push-job-model
