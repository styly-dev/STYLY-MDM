name: Apply Issue 91 implementation

on:
  push:
    branches:
      - suu/issue-91-push-jobs
    paths:
      - .github/issue91-payload/**
      - .github/workflows/apply-issue-91.yml
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
    paths:
      - .github/issue91-payload/**
      - .github/workflows/apply-issue-91.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: suu/issue-91-push-jobs

      - name: Decode implementation payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue91-payload/part-*.b64 | base64 --decode > /tmp/issue91.tar.xz
          tar -xJf /tmp/issue91.tar.xz -C .
          rm -rf .github/issue91-payload
          rm -f .github/workflows/apply-issue-91.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Issue 91 implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e './mdm-server[dev]'
          python -m compileall -q mdm-server/styly_mdm
          pytest -q \
            mdm-server/tests/test_push_job_domain.py \
            mdm-server/tests/test_push_job_store.py \
            mdm-server/tests/test_push_artifacts.py \
            mdm-server/tests/test_transfer_registry.py \
            mdm-server/tests/test_app.py
          node --check mdm-server/styly_mdm/static/push-jobs-v1.js

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: implement durable push job lifecycle (#91)'
          git push origin HEAD:suu/issue-91-push-jobs
