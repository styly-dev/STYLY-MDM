plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.styly.mdmclient'
    compileSdk 33

    defaultConfig {
        applicationId "com.styly.mdmclient"
        minSdk 29
        targetSdk 33
        // Keep versionCode/versionName on plain literal lines: the release-version-bump
        // workflow greps and seds them. Overrides are applied by assignment below so a
        // self-update test run can push a strictly-increasing versionCode without editing
        // this file. CI passes neither property and gets the committed values.
        versionCode 6
        versionName "0.2.3"
        if (project.hasProperty("versionCodeOverride")) {
            versionCode = project.property("versionCodeOverride") as Integer
        }
        if (project.hasProperty("versionNameOverride")) {
            versionName = project.property("versionNameOverride").toString()
        }
    }

    signingConfigs {
        release {
            // Signing credentials are injected via environment variables in CI
            if (System.getenv("KEYSTORE_FILE") != null) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        // Required on AGP 8+ to generate BuildConfig with our custom fields.
        buildConfig true
    }

    flavorDimensions += "environment"
    productFlavors {
        // Production: ships to real devices on the production server's discovery port.
        prod {
            dimension "environment"
            buildConfigField "int", "DISCOVERY_PORT", "7071"
            buildConfigField "int", "DEFAULT_WS_PORT", "7070"
        }
        // Development: separate discovery/WebSocket ports so a dev server/client can run
        // on the same LAN as production without the two discovering each other. The
        // applicationId is intentionally identical to prod (no suffix), so the dev build
        // is NOT installed side-by-side — installing it replaces the production build on a
        // device. Use a dedicated test device (or accept the replacement while testing).
        // The "-dev" versionName and "STYLY-MDM Dev" label show which build is installed.
        dev {
            dimension "environment"
            versionNameSuffix "-dev"
            buildConfigField "int", "DISCOVERY_PORT", "7081"
            buildConfigField "int", "DEFAULT_WS_PORT", "7080"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // The guard APK ships inside the client as assets/guard.apk: the client
    // silent-installs it whenever it is missing or older (GuardLink), so deploying
    // the client is the whole deployment story — no separate guard rollout, and a
    // deleted guard comes back on the next mutual-watch tick. Debug clients embed
    // the debug guard, release clients the release guard.
    sourceSets {
        debug.assets.srcDirs += "${buildDir}/generated/guardApk/debug"
        release.assets.srcDirs += "${buildDir}/generated/guardApk/release"
    }
}

["debug", "release"].each { buildType ->
    def cap = buildType.capitalize()
    tasks.register("copyGuardApk${cap}", Copy) {
        dependsOn ":guard:assemble${cap}"
        from project(":guard").layout.buildDirectory.file("outputs/apk/${buildType}/guard-${buildType}.apk")
        into layout.buildDirectory.dir("generated/guardApk/${buildType}")
        rename { "guard.apk" }
    }
}

android.applicationVariants.all { variant ->
    def cap = variant.buildType.name.capitalize()
    variant.mergeAssetsProvider.configure { dependsOn(tasks.named("copyGuardApk${cap}")) }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.picoxr.tobservice:tobservicelib:4.3.16'
    // tobservicelib's timing APIs (openTimingShutdown/openTimingStartup) serialize
    // their request through com.google.gson.JsonObject but the AAR ships no POM, so
    // Gson is not pulled transitively. Without it those calls raise NoClassDefFoundError
    // (an Error, not an Exception) that bypasses every catch and kills the process.
    implementation 'com.google.code.gson:gson:2.11.0'

    // Host JVM tests. BundleSync deletes files on the device, so its copy-vs-mirror
    // behaviour is proven here rather than only on real hardware.
    testImplementation 'junit:junit:4.13.2'
}
