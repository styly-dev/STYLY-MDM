plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Self-update spike instrumentation (issue #39). MY_PACKAGE_REPLACED is delivered to the
// *new* APK, so the pushed build — not the installed one — decides how the restart is
// probed. Every spike run needs a fresh versionCode anyway, so the mode rides along as a
// Gradle property instead of a runtime toggle.
//   off     — receiver absent from the manifest; measures whether keep-alive alone restarts us
//   observe — receiver records the broadcast but does not start the service
//   act     — receiver also calls startForegroundService(), recording success or the throw
// `off` is the shipped default: a normal build behaves exactly as before.
def spikeMode = (project.findProperty("spikeMode") ?: "off").toString().toLowerCase()
if (!(spikeMode in ["off", "observe", "act"])) {
    throw new GradleException("spikeMode must be one of off|observe|act, got '${spikeMode}'")
}
def packageReplacedReceiverEnabled = (spikeMode != "off")

android {
    namespace 'com.styly.mdmclient'
    compileSdk 33

    defaultConfig {
        applicationId "com.styly.mdmclient"
        minSdk 29
        targetSdk 33
        // Overridable so a spike run can push a strictly-increasing versionCode without
        // editing this file. CI passes neither property and gets the committed values.
        versionCode ((project.findProperty("versionCodeOverride") ?: 6) as Integer)
        versionName ((project.findProperty("versionNameOverride") ?: "0.2.3").toString())

        buildConfigField "String", "SPIKE_MODE", "\"${spikeMode}\""
        // Invariant: the receiver is present in the manifest iff SPIKE_MODE != "off".
        manifestPlaceholders = [packageReplacedReceiverEnabled: packageReplacedReceiverEnabled.toString()]
    }

    signingConfigs {
        release {
            // Signing credentials are injected via environment variables in CI
            if (System.getenv("KEYSTORE_FILE") != null) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        // Required on AGP 8+ to generate BuildConfig with our custom fields.
        buildConfig true
    }

    flavorDimensions += "environment"
    productFlavors {
        // Production: ships to real devices on the production server's discovery port.
        prod {
            dimension "environment"
            buildConfigField "int", "DISCOVERY_PORT", "7071"
            buildConfigField "int", "DEFAULT_WS_PORT", "7070"
        }
        // Development: separate discovery/WebSocket ports so a dev server/client can run
        // on the same LAN as production without the two discovering each other. The
        // applicationId is intentionally identical to prod (no suffix), so the dev build
        // is NOT installed side-by-side — installing it replaces the production build on a
        // device. Use a dedicated test device (or accept the replacement while testing).
        // The "-dev" versionName and "STYLY-MDM Dev" label show which build is installed.
        dev {
            dimension "environment"
            versionNameSuffix "-dev"
            buildConfigField "int", "DISCOVERY_PORT", "7081"
            buildConfigField "int", "DEFAULT_WS_PORT", "7080"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.picoxr.tobservice:tobservicelib:4.3.16'

    // Host JVM tests. BundleSync deletes files on the device, so its copy-vs-mirror
    // behaviour is proven here rather than only on real hardware.
    testImplementation 'junit:junit:4.13.2'
}
